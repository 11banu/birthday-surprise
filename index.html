<!DOCTYPE html>
<html>
<head>
<title>For Lambuuuu ❤️</title>

<style>
body {
    margin: 0;
    background: black;
    color: white;
    text-align: center;
    font-family: 'Segoe UI', sans-serif;
}

/* hide */
.hidden { display: none; }

/* fade */
.fade { opacity: 0; transition: 1.5s; }
.show { opacity: 1; }

/* button */
button {
    padding: 12px 25px;
    background: linear-gradient(45deg,#ff4d6d,#ff758c);
    color: white;
    border: none;
    border-radius: 20px;
    cursor: pointer;
}

/* image */
img {
    width: 80%;
    max-width: 300px;
    border-radius: 15px;
}

/* snapchat typing cursor */
#chatText::after {
    content: "|";
    animation: blink 1s infinite;
}
@keyframes blink {
    50% { opacity: 0; }
}

/* floating hearts */
.heart {
    position: fixed;
    color: #ff4d6d;
    animation: float 6s linear infinite;
}
@keyframes float {
    from { transform: translateY(100vh); }
    to { transform: translateY(-10vh); opacity: 0; }
}

/* canvas heart */
#heartCanvas {
    position: fixed;
    top: 0;
    left: 0;
    z-index: -1;
}
</style>
</head>

<body>

<canvas id="heartCanvas"></canvas>

<!-- PASSWORD -->
<div id="lock">
<h2>Enter Password 💖</h2>
<input type="password" id="pass"><br><br>
<button onclick="unlock()">Unlock ❤️</button>
</div>

<!-- MAIN -->
<div id="main" class="hidden">

<h1 class="fade" id="step1">Happy Birthday Lambuuuu ❤️</h1>

<!-- typing message -->
<div id="step2" class="fade">
<p id="chatText"></p>
</div>

<!-- slideshow -->
<div id="step3" class="fade">
<img id="slide" src="photo1.jpg"><br>
<button onclick="nextSlide()">Next 💙</button>
</div>

<!-- video -->
<div id="step4" class="fade">
<video width="300" controls>
<source src="video.mp4">
</video>
</div>

<!-- final -->
<div id="step5" class="fade">
<h2>If you stayed till here… 💙</h2>
<p>Thank you for being in my life ❤️</p>
</div>

</div>

<!-- music -->
<audio id="music" loop>
<source src="song.mp3">
</audio>

<script>
/* unlock */

function unlock() {

    console.log("unlock clicked");  // 👈 ADD HERE

    let p = document.getElementById("pass").value;

    if (p === "lambuuu") {

        console.log("correct password");  // 👈 ADD HERE

        document.getElementById("lock").style.display = "none";
        document.getElementById("main").classList.remove("hidden");

        document.getElementById("music").play();

        startHearts();
        startSteps();
    } else {
        alert("Wrong password ❌");
    }
}

/* steps */


function startSteps(){

    setTimeout(()=>{
        document.getElementById("step1").classList.add("show");
    },1000);

    setTimeout(()=>{
        snapchatTyping();
    },4000);

    setTimeout(()=>{
        document.getElementById("step3").classList.add("show");
    },9000);

    setTimeout(()=>{
        document.getElementById("step4").classList.add("show");
    },13000);

    setTimeout(()=>{
        document.getElementById("step5").classList.add("show");
    },17000);
}

/* snapchat typing */
function snapchatTyping() {

     let text = `I didn’t really know how to say all this in person…

So I made this 💙

Happy Birthday.

I know a lot of people will wish you today,
but I just wanted to say something a little different.

but I celebrate your parents for bringing such a amazing person into this world.

You’re genuinely a really good person.

The way you respect people,
the way you stay calm,
and still keep that simple, happy side in you…
it’s something rare.

Being around you feels easy.
You don’t even try, but you make things lighter.

And honestly…
thank you for being patient with me,
for understanding me even when I’m not at my best.

It means more than I say.

I don’t know what this is or where it goes…
but I just wanted you to know,
you matter to me 💙

Not just today.
Always.

Note: maybe send me your HD pics every year…
so I can keep making little surprises like this for you 😌💙

And if this made you smile even a little…
that’s already enough for me 💙`;

    let el = document.getElementById("chatText");
    el.innerHTML = "";
    document.getElementById("step2").classList.add("show");

    let i = 0;

    function type() {
        if (i < text.length) {
            if (text[i] === "\n") {
                el.innerHTML += "<br>";
            } else {
                el.innerHTML += text[i];
            }
            i++;
            setTimeout(type, 35);
        }
    }

    type();
}


/* slideshow */
let images=["photo1.jpg","photo2.jpg","photo3.jpg","photo4.jpg"];
let index=0;

function nextSlide(){
    index=(index+1)%images.length;
    document.getElementById("slide").src=images[index];
}

/* floating hearts */
function startHearts(){
    setInterval(()=>{
        let h=document.createElement("div");
        h.className="heart";
        h.innerHTML="❤️";
        h.style.left=Math.random()*100+"vw";
        document.body.appendChild(h);
        setTimeout(()=>h.remove(),6000);
    },300);
}

/* ❤️ sin/cos heart */
const canvas=document.getElementById("heartCanvas");
const ctx=canvas.getContext("2d");

canvas.width=window.innerWidth;
canvas.height=window.innerHeight;

ctx.translate(canvas.width/2,canvas.height/2);

function heart(t){
    let x=16*Math.pow(Math.sin(t),3);
    let y=-(13*Math.cos(t)-5*Math.cos(2*t)-2*Math.cos(3*t)-Math.cos(4*t));
    return [x*12,y*12];
}

let pts=[];
for(let t=0;t<Math.PI*2;t+=0.2){
    pts.push(heart(t));
}
let scale = 1;
let growing = true;
function draw(){

    ctx.clearRect(0, 0, canvas.width, canvas.height);

    ctx.setTransform(1, 0, 0, 1, 0, 0);
    ctx.translate(canvas.width/2, canvas.height/2);

    // 💓 subtle heartbeat
    if(growing){
        scale += 0.004;
        if(scale > 1.04) growing = false;
    } else {
        scale -= 0.004;
        if(scale < 1) growing = true;
    }

    // 🧠 IMPORTANT: smooth edges
    ctx.lineJoin = "round";
    ctx.lineCap = "round";

    // ✨ LAYER 1 → glow (behind)
    ctx.beginPath();
    for(let t=0; t<Math.PI*2; t+=0.025){
        let x = 16 * Math.pow(Math.sin(t),3);
        let y = -(13*Math.cos(t) - 5*Math.cos(2*t) - 2*Math.cos(3*t) - Math.cos(4*t));

        x *= 11 * scale;
        y *= 11 * scale;

        if(t === 0) ctx.moveTo(x,y);
        else ctx.lineTo(x,y);
    }

    ctx.strokeStyle = "#ff4d6d";
    ctx.lineWidth = 3;         // glow layer thicker
    ctx.globalAlpha = 0.2;     // soft glow
    ctx.stroke();

    // ✨ LAYER 2 → sharp line (front)
    ctx.beginPath();
    for(let t=0; t<Math.PI*2; t+=0.025){
        let x = 16 * Math.pow(Math.sin(t),3);
        let y = -(13*Math.cos(t) - 5*Math.cos(2*t) - 2*Math.cos(3*t) - Math.cos(4*t));

        x *= 11 * scale;
        y *= 11 * scale;

        if(t === 0) ctx.moveTo(x,y);
        else ctx.lineTo(x,y);
    }

    ctx.strokeStyle = "#ff6b81";
    ctx.lineWidth = 1;         // 👈 clean thin edge
    ctx.globalAlpha = 1;
    ctx.stroke();
}
    
setInterval(draw,100);
</script>

</body>
</html>
